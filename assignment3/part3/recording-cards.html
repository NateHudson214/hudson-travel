<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Part 3 recording caption cards</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#21362f;font-family:system-ui,sans-serif}.stage{max-width:1100px;margin:6vh auto 0;padding:44px;min-height:70vh}#title{font-size:clamp(30px,3vw,48px);line-height:1.2}#body{font-size:clamp(24px,2.4vw,36px);line-height:1.5}nav{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 auto;max-width:1012px;padding:0 16px}button,select{font:inherit;font-size:18px;padding:12px;color:inherit;background:white;border:1px solid #72877b;border-radius:6px}.hint{font-size:16px;color:#4e6358;max-width:1012px;margin:20px auto;padding:0 16px}button:focus-visible,select:focus-visible{outline:3px solid #406e58}#count{margin-left:auto}</style>
<main class="stage"><h1 id="title"></h1><p id="body"></p></main><nav aria-label="Caption cards"><button id="prev" type="button">Previous</button><button id="next" type="button">Next</button><select id="choose" aria-label="Choose caption"></select><span id="count"></span></nav><p class="hint">Prepared recording script, not a completed video. Arrow keys navigate. Keep the exercise tab in the foreground during pacing; show cards before Start or after completion.</p><script>
const cards=[{"id": "demo-01", "title": "DEMO \u00b7 Coursework prototype", "body": "One 60-second paced-breathing skill. Fictional testing only; not therapy or monitored support. This recording uses mocked conversation."}, {"id": "demo-02", "title": "Design: less demand, explicit choice", "body": "Six 4-second inhales and 6-second exhales. No typing during pacing. Simpler view is chosen by the user; no distress detector decides for them."}, {"id": "demo-03", "title": "Personalization stays optional", "body": "Save display choices explicitly. Reload offers them without applying them. Use last setup applies display choices only and never starts breathing."}, {"id": "demo-04", "title": "Optional conversation has a fixed boundary", "body": "The demo uses a labeled fixed mock. Actual model checks were recorded separately. A model may select approved reply/fact IDs; it cannot change timing, navigation or saved preferences."}, {"id": "demo-05", "title": "Watch one complete sequence", "body": "The next exercise will run in the foreground without typing or switching tabs. After completion, the app will show actual timing and setup separately."}, {"id": "demo-06", "title": "History and reset are separate", "body": "Session history stores acknowledged checkpoints and client-reported time. Conversation history restores saved text. Reset display choices does not erase history."}, {"id": "demo-07", "title": "Stopping and support preserve choice", "body": "Pause and Stop remain available. Support opens independently; Back stays paused until explicit Resume. Leave returns immediately. No service will be contacted in this recording."}, {"id": "demo-08", "title": "Verified results and limits", "body": "15 mocked scenarios and three behavior checks passed. Earlier measured run: 60.005 seconds DOM active; 17.146 seconds setup. Live checks: three expected selections, one timeout. Seven moderate lint-tool findings remain unresolved."}, {"id": "process-01", "title": "PROCESS \u00b7 Actual failure, evidence and decision", "body": "The following files show a real earlier failure and its correction. This is a walkthrough of saved evidence, not a new failure injection or provider call."}, {"id": "process-02", "title": "Failure: fresh setup broke test cleanup", "body": "Initial isolated setup: 362 backend tests passed; 130 fixture setup errors. The missing State attribute appeared after pytest undid a dynamic attribute patch."}, {"id": "process-03", "title": "Evidence explains the failure", "body": "The saved reproduction shows the attribute exists before patching and disappears after undo. Starlette keeps dynamic attributes in its state dictionary; pytest cleanup was restoring the wrong storage location."}, {"id": "process-04", "title": "Decision and correction", "body": "Patch the State dictionary with monkeypatch.setitem. Keep production code and dependency versions unchanged. One multiline patch was initially missed; correcting it led to 492 passing backend tests."}, {"id": "process-05", "title": "Generated code: application-owned pacing", "body": "breathing.js fixes six 4/6-second cycles. The monotonic clock tracks actual active time and separates pauses/support/setup. A delayed cue pauses rather than silently skipping phases; the 250 ms threshold remains provisional."}, {"id": "process-06", "title": "Generated code: reviewed text only", "body": "render_reply validates the exact reply/fact shape, compatible IDs and limits. It renders application catalog text. The provider has a finite deadline; a failure yields the application fallback, not arbitrary therapeutic prose."}, {"id": "process-07", "title": "Unexpected behavior and live limitation", "body": "A delayed mock can save after Leave while its late result stays out of the abandoned screen. A real typing check timed out; the next planned typing attempt succeeded. No retry was made, so only one successful typing selection is available."}, {"id": "process-08", "title": "What remains before submission", "body": "Seven moderate lint-tool findings stay unresolved. Recordings, committed clean-checkout verification, final approval, exact commit-pinned links and grader access must still be checked. This prototype does not establish clinical effectiveness."}];
const title=document.getElementById('title'),body=document.getElementById('body'),choose=document.getElementById('choose');let current=0;
for(const card of cards){const option=document.createElement('option');option.value=card.id;option.textContent=card.id+' · '+card.title;choose.append(option)}
function render(){const index=cards.findIndex(c=>c.id===location.hash.slice(1));current=index<0?0:index;const card=cards[current];title.textContent=card.title;body.textContent=card.body;choose.value=card.id;document.getElementById('count').textContent=(current+1)+' / '+cards.length}
function move(delta){location.hash=cards[Math.max(0,Math.min(cards.length-1,current+delta))].id}
document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);choose.onchange=()=>{location.hash=choose.value};window.addEventListener('hashchange',render);window.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});render();
</script></html>
