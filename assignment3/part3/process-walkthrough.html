 "2 \u00b7 Evidence narrows the cause", "text": "The setting exists before and during the patch, then disappears after undo. Starlette stores dynamic settings in its _state dictionary. This is test cleanup incompatibility, not proof that normal app startup is broken.", "seconds": 25, "code": "{\n  \"pytest\": \"9.2.0\",\n  \"starlette\": \"1.10.0\",\n  \"attribute\": \"skills_database_path\",\n  \"before\": true,\n  \"during\": true,\n  \"after_undo\": false,\n  \"mode_mock\": true\n}\n", "source": "evidence/assignment3-part3-setup/pytest-reproduction.json"}, {"title": "3 \u00b7 Match the actual storage", "text": "monkeypatch.setitem patches State storage so teardown restores dictionary entries. The change is in test isolation, not production behavior or package versions. Include the multiline clock-provider patch.", "seconds": 30, "code": " 15  \n 16  @pytest.fixture\n 17  def skills_client(client, tmp_path, monkeypatch):\n 18      # Patch State storage directly so pytest undo restores dynamic attributes.\n 19      monkeypatch.setitem(app.state._state, \"skills_database_path\", tmp_path / \"skills.sqlite3\")\n 20      monkeypatch.setitem(\n 21          app.state._state, \"skills_now_provider\",\n 22          lambda: datetime(2026, 10, 21, 12, tzinfo=timezone.utc),\n 23      )\n 24      # A session request must not touch any configured travel-model provider.\n 25      def unexpected_provider(*args, **kwargs):\n 26          pytest.fail(\"A skills session operation reached a model provider.\")\n 27      monkeypatch.setitem(app.state._state, \"advisor_query_proposer\", unexpected_provider)\n 28      monkeypatch.setitem(app.state._state, \"advisor_answer_generator\", unexpected_provider)\n 29      return client", "source": "backend/tests/skills/test_sessions.py \u00b7 lines 15\u201329"}, {"title": "4 \u00b7 Verify, including the missed line", "text": "The first correction missed a multiline patch: 444 passed, 48 errors. Correcting it led to 492 passes. A separate 164-test diagnostic confirmed every original app-state key and binding survives cleanup.", "seconds": 25, "code": "444 passed, 48 errors in 3.43s\n\n492 passed in 5.69s\n\n164 passed, 1 warning in 5.21s\n{\"pytest_exit\": 0, \"same_state_keys_and_original_bindings\": true}", "source": "Saved first-correction output, latest full backend gate and state-isolation diagnostic"}, {"title": "5 \u00b7 Generated code: the app owns pacing", "text": "Four seconds in, six seconds out, six cycles. No model or network input enters this module. The application keeps the reviewed sequence intact rather than asking a model to invent instructions.", "seconds": 25, "code": "  1  // Application-owned timing. No model response or network request enters this module.\n  2  export const BREATHING_SKILL = Object.freeze({\n  3    id: 'paced_breathing_4_6',\n  4    version: '1',\n  5    inhaleMs: 4000,\n  6    exhaleMs: 6000,\n  7    cycles: 6,\n  8    plannedMs: 60000,\n  9  })", "source": "frontend/src/skills/breathing.js \u00b7 lines 1\u20139"}, {"title": "6 \u00b7 Measure actual elapsed time", "text": "A monotonic clock supplies deltas. Running time includes application delay. Paused time is separated into support or other pauses. Excess cue delay pauses instead of skipping phases; the 250 ms threshold remains provisional.", "seconds": 30, "code": " 48    function sample() {\n 49      const at = now()\n 50      if (!Number.isFinite(at) || at < lastAt) {\n 51        throw new RangeError('Clock must be finite and monotonic.')\n 52      }\n 53      const delta = at - lastAt\n 54      lastAt = at\n 55      if (status === 'paused') {\n 56        if (supportOpen) supportMs += delta\n 57        else pauseMs += delta\n 58      } else if (status === 'running') {\n 59        activeMs += delta\n 60        if (delta > remainingMs + MAX_CUE_DELAY_MS) {\n 61          // Retain the last presented phase instead of silently skipping cues.\n 62          status = 'paused'\n 63          pauseReason = 'timing'\n 64        } else if (delta >= remainingMs) {", "source": "frontend/src/skills/breathing.js \u00b7 lines 48\u201364"}, {"title": "7 \u00b7 Support cannot resume for the user", "text": "closeSupport clears the panel flag. Only explicit resume changes paused to running, and only with support closed. This is application logic, not a system-prompt promise.", "seconds": 25, "code": "116    function closeSupport() {\n117      sample()\n118      supportOpen = false\n119      // Closing the panel deliberately leaves an active exercise paused.\n120      return snapshot()\n121    }\n122  \n123    function resume() {\n124      sample()\n125      if (status === 'paused' && !supportOpen) {\n126        status = 'running'\n127        pauseReason = null\n128      }\n129      return snapshot()", "source": "frontend/src/skills/breathing.js \u00b7 lines 116\u2013129"}, {"title": "8 \u00b7 Generated code: validate the shape", "text": "Accept exactly reply_id and fact_ids, an approved reply, at most two facts and the required types. Valid JSON alone does not make a response approved.", "seconds": 30, "code": " 51  def render_reply(selection: object) -> str:\n 52      if type(selection) is not dict or set(selection) != {\"reply_id\", \"fact_ids\"}:\n 53          raise InvalidReply(\"The reply selection is invalid.\")\n 54      reply_id = selection[\"reply_id\"]\n 55      fact_ids = selection[\"fact_ids\"]\n 56      if (\n 57          type(reply_id) is not str\n 58          or reply_id not in _REPLIES\n 59          or type(fact_ids) is not list\n 60          or len(fact_ids) > 2\n 61          or any(type(value) is not str for value in fact_ids)\n 62      ):\n 63          raise InvalidReply(\"The reply selection is invalid.\")", "source": "backend/app/skills/replies.py \u00b7 lines 51\u201363"}, {"title": "9 \u00b7 Render application-owned text", "text": "Reject duplicate or incompatible facts. Build visible text from the reviewed catalog and enforce its length limit. Arbitrary model-written therapeutic prose cannot pass through this renderer.", "seconds": 25, "code": " 64      if len(set(fact_ids)) != len(fact_ids) or any(\n 65          fact not in _ALLOWED_FACTS[reply_id] for fact in fact_ids\n 66      ):\n 67          raise InvalidReply(\"The reply selection is invalid.\")\n 68      text = \" \".join([_REPLIES[reply_id], *(_FACTS[fact] for fact in fact_ids)])\n 69      if len(text) > 600:\n 70          raise InvalidReply(\"The reply selection exceeds its limit.\")\n 71      return text", "source": "backend/app/skills/replies.py \u00b7 lines 64\u201371"}, {"title": "10 \u00b7 Finite waiting, no automatic retry", "text": "One dispatch has a finite deadline and bounded context/output. A timeout becomes a safe category. The app can save its fixed fallback and let the user continue without conversation; it does not automatically spend again.", "seconds": 25, "code": " 13  TIMEOUT_SECONDS = 3.0\n 14  MAX_OUTPUT_TOKENS = 512\n 15  MAX_INPUT_BYTES = 20000\n 16  INSTRUCTIONS = Path(__file__).with_name('prompts').joinpath('selector-v1.md').read_text()\n 17  PROMPT_HASH = hashlib.sha256(INSTRUCTIONS.encode()).hexdigest()\n 18  \n\n 98      try:\n 99          return await asyncio.wait_for(dispatch(), TIMEOUT_SECONDS)\n100      except (TimeoutError, httpx.TimeoutException):\n101          raise ProviderFailure('timeout') from None\n102      except httpx.HTTPError:\n103          raise ProviderFailure('transport') from None", "source": "backend/app/skills/provider.py \u00b7 lines 13\u201318; backend/app/skills/provider.py \u00b7 lines 98\u2013103"}, {"title": "11 \u00b7 Live failure and resulting decision", "text": "Four actual attempts: typing timeout, expected typing selection, two identical expected motion selections. No retries. Keep finite waiting, count failures and preserve optional continuation. Typing has only one successful selection to compare.", "seconds": 30, "code": "Case       Attempt   Saved status   Route time\ntyping     1         failed         3066 ms\ntyping     2         completed      1522 ms\nmotion     1         completed      2693 ms\nmotion     2         completed      1838 ms", "source": "evidence/assignment3-part3-live-checks/batch.json \u00b7 actual saved status/elapsed values"}, {"title": "12 \u00b7 Surprising finding and remaining limits", "text": "A delayed mock may save after immediate Leave while its late reply stays out of the abandoned UI. Do not promise to undo dispatched work. Seven moderate lint-tool findings remain unresolved. OS reduced-motion/CSS, full accessibility and device/load timing remain untested. Software evidence is not clinical effectiveness. Final media, committed-checkout, publication and grader access still need verification.", "seconds": 35, "code": "", "source": "Prepared explanation based on verified source/evidence"}];let index=0;const choose=document.getElementById('choose');for(let i=0;i<pages.length;i++){const o=document.createElement('option');o.value=String(i);o.textContent=(i+1)+' · '+pages[i].title;choose.append(o)}
